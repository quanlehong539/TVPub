name: Update M3U Playlist

on:
  schedule:
    - cron: "*/15 * * * *" # Chạy mỗi 15 phút (UTC)
  workflow_dispatch:       # Cho phép bấm chạy thủ công trên GitHub
  push:
    paths:
      - "generate_m3u.py"   # Tự chạy khi cập nhật code
      
permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Generate TVPubSports.m3u
        run: python scripts/generate_m3u.py

      - name: Run script
        run: echo "Run every 15 minutes at $(date -u)"
      
      - name: Commit and push if changed
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TVPubSports.m3u
            git commit -m "chore: update TVPubSports.m3u"
            git push
