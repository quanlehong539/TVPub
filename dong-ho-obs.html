<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đồng hồ Tahoma • OBS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    svg { display: block; width: 100%; height: 100%; }
    text { font-family: Tahoma, sans-serif; font-size: 206px; font-weight: 400; fill: #fffaf7; }
  </style>
</head>
<body>
  <!-- Kích thước gốc: 1168 × 328. Nền bên ngoài luôn trong suốt. -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 328" role="img" aria-label="Đồng hồ">
    <defs>
      <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
        <!-- Viền đen mềm bao quanh cả bốn phía, nằm dưới phần chữ trắng. -->
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="outlineAlpha"/>
        <feGaussianBlur in="outlineAlpha" stdDeviation="1.8" result="softOutline"/>
        <feFlood flood-color="#000" flood-opacity=".85" result="black"/>
        <feComposite in="black" in2="softOutline" operator="in" result="outline"/>
        <feMorphology id="thin-strokes" in="SourceAlpha" operator="erode" radius="1.7 1.3" result="thinAlpha"/>
        <feComposite in="SourceGraphic" in2="thinAlpha" operator="in" result="thinText"/>
        <feGaussianBlur in="thinText" stdDeviation=".45" result="softText"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="softText"/>
        </feMerge>
      </filter>
    </defs>
    <rect id="panel" x="2" y="2" width="1164" height="324" rx="64" fill="#000" fill-opacity=".85"/>
    <g id="clock" text-anchor="middle" filter="url(#shadow)" opacity="0.975">
      <text x="205" y="237" textLength="186" lengthAdjust="spacingAndGlyphs">0</text>
      <text x="404" y="237" textLength="186" lengthAdjust="spacingAndGlyphs">0</text>
      <g id="colon" fill="#fffaf7" transform="translate(574 0)">
        <rect x="-22" y="120" width="44" height="30"/>
        <rect x="-22" y="202" width="44" height="30"/>
      </g>
      <text x="757" y="237" textLength="186" lengthAdjust="spacingAndGlyphs">0</text>
      <text x="956" y="237" textLength="186" lengthAdjust="spacingAndGlyphs">0</text>
    </g>
  </svg>
  <script>
    // Có thể sửa trực tiếp các giá trị dưới đây rồi bấm Refresh trong OBS.
    const SETTINGS = {
      timeZone: 'Asia/Ho_Chi_Minh', // Đặt '' để dùng múi giờ máy tính.
      backgroundOpacity: 0.85,
      textColor: '#fffaf7',
      cornerRadius: 64,
      // Tâm và độ giãn của từng ký tự: giờ, giờ, dấu hai chấm, phút, phút.
      characterCenters: [205, 404, 574, 757, 956],
      characterWidths: [186, 186, 44, 186, 186],
      strokeThinning: [1.7, 1.3], // Làm mảnh nét theo chiều ngang/dọc, không đổi tâm ký tự.
      previewTime: '', // Đặt '16:37' để đối chiếu ảnh; để '' cho giờ thực.
    };

    const query = new URLSearchParams(location.search);
    const fixedTime = query.get('time') || SETTINGS.previewTime;
    const clock = document.getElementById('clock');
    const panel = document.getElementById('panel');
    panel.setAttribute('fill-opacity', SETTINGS.backgroundOpacity);
    panel.setAttribute('rx', SETTINGS.cornerRadius);
    document.getElementById('thin-strokes').setAttribute('radius', SETTINGS.strokeThinning.join(' '));
    const characters = Array.from(clock.querySelectorAll('text'));
    const digitPositions = [0, 1, 3, 4];
    const colon = document.getElementById('colon');
    colon.setAttribute('fill', SETTINGS.textColor);
    colon.setAttribute('transform', `translate(${SETTINGS.characterCenters[2]} 0)`);
    colon.querySelectorAll('rect').forEach(dot => {
      dot.setAttribute('width', SETTINGS.characterWidths[2]);
      dot.setAttribute('x', -SETTINGS.characterWidths[2] / 2);
    });
    characters.forEach((character, index) => {
      character.style.fill = SETTINGS.textColor;
      character.setAttribute('x', SETTINGS.characterCenters[digitPositions[index]]);
      character.setAttribute('textLength', SETTINGS.characterWidths[digitPositions[index]]);
    });
    let previousValue = '';
    const formatOptions = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
    if (SETTINGS.timeZone) formatOptions.timeZone = SETTINGS.timeZone;
    const formatter = new Intl.DateTimeFormat('en-GB', formatOptions);
    function updateClock() {
      const value = /^([01]\d|2[0-3]):[0-5]\d$/.test(fixedTime)
        ? fixedTime : formatter.format(new Date());
      if (previousValue !== value) {
        characters.forEach((character, index) => {
          character.textContent = value[digitPositions[index]];
        });
        previousValue = value;
        clock.parentElement.setAttribute('aria-label', value);
      }
    }
    updateClock();
    setInterval(updateClock, 250);
    document.addEventListener('visibilitychange', updateClock);
    window.addEventListener('pageshow', updateClock);
  </script>
</body>
</html>
